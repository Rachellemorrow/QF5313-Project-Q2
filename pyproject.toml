[project]
name = "q2-futures-research"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.2.6", "scipy==1.15.3", "pandas==2.3.1",
  "torch==2.7.1", "plotly==6.2.0", "rich==14.1.0",
  "akshare==1.17.85", "pytest==8.4.1", "line-profiler==5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "integration_*.py"]
pythonpath = ["code"]
addopts = "--basetemp=.cache/pytest-tmp"
