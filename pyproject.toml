[project]
name = "advanced-programming-2026-q2"
version = "0.1.0"
description = "Advanced Programming 2026, Question 2: Monte Carlo pricing and hedging on Chinese futures"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.3.1",
    "scikit-learn==1.7.1",
    "torch==2.7.1",
    "plotly==6.2.0",
    "rich==14.1.0",
    "akshare==1.17.85",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "line-profiler==4.2.0",
]

[tool.uv]
package = false
